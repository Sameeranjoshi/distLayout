<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>distlayout explorer</title>
<style>
:root{--ink:#17253C;--muted:#52657B;--faint:#8896A8;--card:#F6F9FD;--line:#DDE7F2;--bg:#FFFFFF;
--ghost:#A8C9F1;--comm:#D95455;--code:#F4F7FB;--accent:#3978CF;--ok:#249A82}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E8EEF6;--muted:#A9B7C8;--faint:#7D8FA3;
--card:#18222F;--line:#2A3747;--bg:#0F1722;--ghost:#3C5A80;--code:#141D29}}
:root[data-theme="dark"]{--ink:#E8EEF6;--muted:#A9B7C8;--faint:#7D8FA3;--card:#18222F;--line:#2A3747;--bg:#0F1722;--ghost:#3C5A80;--code:#141D29}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Aptos,"Segoe UI",Inter,system-ui,-apple-system,sans-serif;font-size:14px}
.wrap{margin:0 auto;padding:20px 28px 32px}
h1{font-size:24px;margin:0 0 12px;font-weight:700}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.presets button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
border-radius:8px;padding:6px 12px;cursor:pointer}
.presets button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.presets{flex-direction:column;align-items:stretch;gap:10px}
.pgroup{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pgroup .lbl{font-size:13px;font-weight:600;color:var(--muted);min-width:230px}
.main{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 4px}
h3{font-size:12.5px;margin:14px 0 2px;color:var(--ink)}
label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}
input,select{font:inherit;font-size:13px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.help{color:var(--faint);font-size:11.5px;margin:2px 0 0}
.err{color:var(--comm);font-size:12.5px;min-height:18px;margin-top:8px}
.tabs{display:flex;gap:4px;margin:0;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
pre{background:var(--code);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;margin:0;padding:10px 12px;
font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;max-height:560px;overflow:auto}
.codecard{margin-top:18px}
.note{color:var(--muted);font-size:13px;margin:0 0 10px}
.formula{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);min-height:20px;margin:8px 0 0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stat{font-size:12.5px;color:var(--muted)}.stat b{color:var(--ink)}
svg text{font-family:Aptos,"Segoe UI",Inter,system-ui,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;margin-top:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}
</style></head><body><div class="wrap">
<h1>distlayout explorer</h1>
<div class="presets" id="presets"></div>
<div class="main">
 <div class="card">
  <h2>Layout</h2>
  <div class="row"><div><label>Tensor shape</label><input id="shape"></div><div><label>PE grid</label><input id="grid"></div></div>
  <h3>① Decomposition layout</h3>
  <div id="cuts"></div>
  <h3>③ Mapping layout</h3>
  <div id="maps"></div>
  <div class="row"><div><label>Halo radius</label><input id="halo" type="number" min="0" value="0"></div>
   <div><label>Bytes / element · PE KiB</label><div class="row"><input id="bytes" type="number" min="1"><input id="kib" type="number" min="1"></div></div></div>
  <div class="err" id="err"></div>
 </div>
 <div class="card">
  <div id="pic"></div>
  <div class="formula" id="formula"></div>
  <div class="bar"><button class="btn" id="pin">Pin as A</button><button class="btn" id="svg">Export SVG</button><span class="stat" id="stat"></span></div>
 </div>
</div>
<div class="card codecard"><div class="tabs" id="tabs"></div><pre id="code"></pre></div>
</div>
<script>
const PRESETS=[{"title": "Block", "group": "1. Structured tensor sharding", "note": "100 elements in 4 equal blocks, one per PE.", "shape": [100], "grid": [4, 1], "cuts": [{"axis": 0, "kind": "block", "parts": 4}], "map": ["t0", null], "halo": 0, "bytes": 4, "kib": 48, "src": "l2", "mlir": "#map = affine_map<()[s0, s1] -> (s0 * 50 + s1 * 25)>\nmodule {\n  func.func @dist_copy(%arg0: memref<100xf32>, %arg1: memref<100xf32>) {\n    %c1 = arith.constant 1 : index\n    %c1_0 = arith.constant 1 : index\n    air.launch (%arg2, %arg3) in (%arg4=%c1, %arg5=%c1_0) args(%arg6=%arg0, %arg7=%arg1) : memref<100xf32>, memref<100xf32> {\n      air.segment @dist_copy_seg  args(%arg8=%arg6, %arg9=%arg7) : memref<100xf32>, memref<100xf32> {\n        %alloc = memref.alloc() : memref<100xf32, 1 : i32>\n        %alloc_1 = memref.alloc() : memref<100xf32, 1 : i32>\n        air.dma_memcpy_nd (%alloc[] [] [], %arg8[] [] []) : (memref<100xf32, 1 : i32>, memref<100xf32>)\n        %c2 = arith.constant 2 : index\n        %c1_2 = arith.constant 1 : index\n        air.herd @dist_copy_herd  tile (%arg10, %arg11) in (%arg12=%c2, %arg13=%c1_2) args(%arg14=%alloc, %arg15=%alloc_1) : memref<100xf32, 1 : i32>, memref<100xf32, 1 : i32> {\n          %c0 = arith.constant 0 : index\n          %c2_3 = arith.constant 2 : index\n          %c1_4 = arith.constant 1 : index\n          scf.for %arg16 = %c0 to %c2_3 step %c1_4 {\n            %alloc_5 = memref.alloc() : memref<25xf32, 2 : i32>\n            %0 = affine.apply #map()[%arg10, %arg16]\n            air.dma_memcpy_nd (%alloc_5[] [] [], %arg14[%0] [25] [1]) : (memref<25xf32, 2 : i32>, memref<100xf32, 1 : i32>)\n            %1 = affine.apply #map()[%arg10, %arg16]\n            air.dma_memcpy_nd (%arg15[%1] [25] [1], %alloc_5[] [] []) : (memref<100xf32, 1 : i32>, memref<25xf32, 2 : i32>)\n            memref.dealloc %alloc_5 : memref<25xf32, 2 : i32>\n          }\n        }\n        memref.dealloc %alloc : memref<100xf32, 1 : i32>\n        air.dma_memcpy_nd (%arg9[] [] [], %alloc_1[] [] []) : (memref<100xf32>, memref<100xf32, 1 : i32>)\n        memref.dealloc %alloc_1 : memref<100xf32, 1 : i32>\n      }\n    }\n    return\n  }\n}\n"}, {"title": "Block + replicate", "group": "1. Structured tensor sharding", "note": "4 blocks on a 4 \u00d7 4 grid. Grid axis g1 holds nothing new, so each block is replicated along it (lighter cards are replicas).", "shape": [100], "grid": [4, 4], "cuts": [{"axis": 0, "kind": "block", "parts": 4}], "map": ["t0", null], "halo": 0, "bytes": 4, "kib": 48, "src": "l2", "mlir": "#map = affine_map<()[s0, s1] -> (s0 * 50 + s1 * 25)>\nmodule {\n  func.func @dist_copy(%arg0: memref<100xf32>, %arg1: memref<100xf32>) {\n    %c1 = arith.constant 1 : index\n    %c1_0 = arith.constant 1 : index\n    air.launch (%arg2, %arg3) in (%arg4=%c1, %arg5=%c1_0) args(%arg6=%arg0, %arg7=%arg1) : memref<100xf32>, memref<100xf32> {\n      air.segment @dist_copy_seg  args(%arg8=%arg6, %arg9=%arg7) : memref<100xf32>, memref<100xf32> {\n        %alloc = memref.alloc() : memref<100xf32, 1 : i32>\n        %alloc_1 = memref.alloc() : memref<100xf32, 1 : i32>\n        air.dma_memcpy_nd (%alloc[] [] [], %arg8[] [] []) : (memref<100xf32, 1 : i32>, memref<100xf32>)\n        %c2 = arith.constant 2 : index\n        %c4 = arith.constant 4 : index\n        air.herd @dist_copy_herd  tile (%arg10, %arg11) in (%arg12=%c2, %arg13=%c4) args(%arg14=%alloc, %arg15=%alloc_1) : memref<100xf32, 1 : i32>, memref<100xf32, 1 : i32> {\n          %c0 = arith.constant 0 : index\n          %c2_2 = arith.constant 2 : index\n          %c1_3 = arith.constant 1 : index\n          scf.for %arg16 = %c0 to %c2_2 step %c1_3 {\n            %alloc_4 = memref.alloc() : memref<25xf32, 2 : i32>\n            %0 = affine.apply #map()[%arg10, %arg16]\n            air.dma_memcpy_nd (%alloc_4[] [] [], %arg14[%0] [25] [1]) : (memref<25xf32, 2 : i32>, memref<100xf32, 1 : i32>)\n            %1 = affine.apply #map()[%arg10, %arg16]\n            air.dma_memcpy_nd (%arg15[%1] [25] [1], %alloc_4[] [] []) : (memref<100xf32, 1 : i32>, memref<25xf32, 2 : i32>)\n            memref.dealloc %alloc_4 : memref<25xf32, 2 : i32>\n          }\n        }\n        memref.dealloc %alloc : memref<100xf32, 1 : i32>\n        air.dma_memcpy_nd (%arg9[] [] [], %alloc_1[] [] []) : (memref<100xf32>, memref<100xf32, 1 : i32>)\n        memref.dealloc %alloc_1 : memref<100xf32, 1 : i32>\n      }\n    }\n    return\n  }\n}\n"}, {"title": "Uneven", "group": "1. Structured tensor sharding", "note": "99 elements over 4 PEs: 25, 25, 25, 24. Try 'block' on axis 0 to see why uneven is needed.", "shape": [99], "grid": [4, 1], "cuts": [{"axis": 0, "kind": "uneven", "parts": 4, "policy": "balanced"}], "map": ["t0", null], "halo": 0, "bytes": 4, "kib": 48, "src": "l2", "mlir": "#map = affine_map<()[s0, s1] -> (s0 * 2 + s1)>\n#map1 = affine_map<()[s0, s1] -> (s0 * 50 + s1 * 25)>\nmodule {\n  func.func @dist_copy(%arg0: memref<99xf32>, %arg1: memref<99xf32>) {\n    %c1 = arith.constant 1 : index\n    %c1_0 = arith.constant 1 : index\n    air.launch (%arg2, %arg3) in (%arg4=%c1, %arg5=%c1_0) args(%arg6=%arg0, %arg7=%arg1) : memref<99xf32>, memref<99xf32> {\n      air.segment @dist_copy_seg  args(%arg8=%arg6, %arg9=%arg7) : memref<99xf32>, memref<99xf32> {\n        %alloc = memref.alloc() : memref<99xf32, 1 : i32>\n        %alloc_1 = memref.alloc() : memref<99xf32, 1 : i32>\n        air.dma_memcpy_nd (%alloc[] [] [], %arg8[] [] []) : (memref<99xf32, 1 : i32>, memref<99xf32>)\n        %c2 = arith.constant 2 : index\n        %c1_2 = arith.constant 1 : index\n        air.herd @dist_copy_herd  tile (%arg10, %arg11) in (%arg12=%c2, %arg13=%c1_2) args(%arg14=%alloc, %arg15=%alloc_1) : memref<99xf32, 1 : i32>, memref<99xf32, 1 : i32> {\n          %c0 = arith.constant 0 : index\n          %c2_3 = arith.constant 2 : index\n          %c1_4 = arith.constant 1 : index\n          scf.for %arg16 = %c0 to %c2_3 step %c1_4 {\n            %alloc_5 = memref.alloc() : memref<25xf32, 2 : i32>\n            %0 = affine.apply #map()[%arg10, %arg16]\n            %c2_6 = arith.constant 2 : index\n            %1 = arith.cmpi sle, %0, %c2_6 : index\n            scf.if %1 {\n              %4 = affine.apply #map1()[%arg10, %arg16]\n              air.dma_memcpy_nd (%alloc_5[] [] [], %arg14[%4] [25] [1]) : (memref<25xf32, 2 : i32>, memref<99xf32, 1 : i32>)\n            } else {\n              air.dma_memcpy_nd (%alloc_5[0] [24] [1], %arg14[75] [24] [1]) : (memref<25xf32, 2 : i32>, memref<99xf32, 1 : i32>)\n            }\n            %2 = affine.apply #map()[%arg10, %arg16]\n            %c2_7 = arith.constant 2 : index\n            %3 = arith.cmpi sle, %2, %c2_7 : index\n            scf.if %3 {\n              %4 = affine.apply #map1()[%arg10, %arg16]\n              air.dma_memcpy_nd (%arg15[%4] [25] [1], %alloc_5[] [] []) : (memref<99xf32, 1 : i32>, memref<25xf32, 2 : i32>)\n            } else {\n              air.dma_memcpy_nd (%arg15[75] [24] [1], %alloc_5[0] [24] [1]) : (memref<99xf32, 1 : i32>, memref<25xf32, 2 : i32>)\n            }\n            memref.dealloc %alloc_5 : memref<25xf32, 2 : i32>\n          }\n        }\n        memref.dealloc %alloc : memref<99xf32, 1 : i32>\n        air.dma_memcpy_nd (%arg9[] [] [], %alloc_1[] [] []) : (memref<99xf32>, memref<99xf32, 1 : i32>)\n        memref.dealloc %alloc_1 : memref<99xf32, 1 : i32>\n      }\n    }\n    return\n  }\n}\n", "air": "with air.herd([range(4), range(1)]) as h:\n  @h.body\n  def _(tx, ty):\n    a = air.alloc([25], f32, scope=h.private())\n    with air.ops.branch(tx <= 2) as b0:\n      air.ops.load(a, l2[tx*25 : tx*25 + 25])\n    with b0.otherwise():\n      air.ops.load(a[0 : 24], l2[75 : 99])\n    ...                                   # compute on a\n    with air.ops.branch(tx <= 2) as b1:\n      air.ops.store(a, l2_out[tx*25 : tx*25 + 25])\n    with b1.otherwise():\n      air.ops.store(a[0 : 24], l2_out[75 : 99])\n\n# 2 size class(es) per cut axis; each branch has static sizes"}, {"title": "Replicate", "group": "1. Structured tensor sharding", "note": "Nothing is split, so every PE holds the whole tensor; PE 0 is the owner.", "shape": [100], "grid": [4, 4], "cuts": [], "map": [null, null], "halo": 0, "bytes": 4, "kib": 48, "src": "l2", "mlir": "module {\n  func.func @dist_copy(%arg0: memref<100xf32>, %arg1: memref<100xf32>) {\n    %c1 = arith.constant 1 : index\n    %c1_0 = arith.constant 1 : index\n    air.launch (%arg2, %arg3) in (%arg4=%c1, %arg5=%c1_0) args(%arg6=%arg0, %arg7=%arg1) : memref<100xf32>, memref<100xf32> {\n      air.segment @dist_copy_seg  args(%arg8=%arg6, %arg9=%arg7) : memref<100xf32>, memref<100xf32> {\n        %alloc = memref.alloc() : memref<100xf32, 1 : i32>\n        %alloc_1 = memref.alloc() : memref<100xf32, 1 : i32>\n        air.dma_memcpy_nd (%alloc[] [] [], %arg8[] [] []) : (memref<100xf32, 1 : i32>, memref<100xf32>)\n        %c2 = arith.constant 2 : index\n        %c4 = arith.constant 4 : index\n        air.herd @dist_copy_herd  tile (%arg10, %arg11) in (%arg12=%c2, %arg13=%c4) args(%arg14=%alloc, %arg15=%alloc_1) : memref<100xf32, 1 : i32>, memref<100xf32, 1 : i32> {\n          %c0 = arith.constant 0 : index\n          %c2_2 = arith.constant 2 : index\n          %c1_3 = arith.constant 1 : index\n          scf.for %arg16 = %c0 to %c2_2 step %c1_3 {\n            %alloc_4 = memref.alloc() : memref<100xf32, 2 : i32>\n            air.dma_memcpy_nd (%alloc_4[] [] [], %arg14[0] [100] [1]) : (memref<100xf32, 2 : i32>, memref<100xf32, 1 : i32>)\n            air.dma_memcpy_nd (%arg15[0] [100] [1], %alloc_4[] [] []) : (memref<100xf32, 1 : i32>, memref<100xf32, 2 : i32>)\n            memref.dealloc %alloc_4 : memref<100xf32, 2 : i32>\n          }\n        }\n        memref.dealloc %alloc : memref<100xf32, 1 : i32>\n        air.dma_memcpy_nd (%arg9[] [] [], %alloc_1[] [] []) : (memref<100xf32>, memref<100xf32, 1 : i32>)\n        memref.dealloc %alloc_1 : memref<100xf32, 1 : i32>\n      }\n    }\n    return\n  }\n}\n"}, {"title": "2-D block", "group": "1. Structured tensor sharding", "note": "16 \u00d7 32 in 2 \u00d7 2 tiles: axis 0 over g0, axis 1 over g1.", "shape": [16, 32], "grid": [2, 2], "cuts": [{"axis": 0, "kind": "block", "parts": 2}, {"axis": 1, "kind": "block", "parts": 2}], "map": ["t0", "t1"], "halo": 0, "bytes": 4, "kib": 48, "src": "l2", "mlir": "#map = affine_map<()[s0] -> (s0 * 8)>\n#map1 = affine_map<()[s0] -> (s0 * 16)>\nmodule {\n  func.func @dist_copy(%arg0: memref<16x32xf32>, %arg1: memref<16x32xf32>) {\n    %c1 = arith.constant 1 : index\n    %c1_0 = arith.constant 1 : index\n    air.launch (%arg2, %arg3) in (%arg4=%c1, %arg5=%c1_0) args(%arg6=%arg0, %arg7=%arg1) : memref<16x32xf32>, memref<16x32xf32> {\n      air.segment @dist_copy_seg  args(%arg8=%arg6, %arg9=%arg7) : memref<16x32xf32>, memref<16x32xf32> {\n        %alloc = memref.alloc() : memref<16x32xf32, 1 : i32>\n        %alloc_1 = memref.alloc() : memref<16x32xf32, 1 : i32>\n        air.dma_memcpy_nd (%alloc[] [] [], %arg8[] [] []) : (memref<16x32xf32, 1 : i32>, memref<16x32xf32>)\n        %c2 = arith.constant 2 : index\n        %c2_2 = arith.constant 2 : index\n        air.herd @dist_copy_herd  tile (%arg10, %arg11) in (%arg12=%c2, %arg13=%c2_2) args(%arg14=%alloc, %arg15=%alloc_1) : memref<16x32xf32, 1 : i32>, memref<16x32xf32, 1 : i32> {\n          %alloc_3 = memref.alloc() : memref<8x16xf32, 2 : i32>\n          %0 = affine.apply #map()[%arg10]\n          %1 = affine.apply #map1()[%arg11]\n          air.dma_memcpy_nd (%alloc_3[] [] [], %arg14[%0, %1] [8, 16] [32, 1]) : (memref<8x16xf32, 2 : i32>, memref<16x32xf32, 1 : i32>)\n          %2 = affine.apply #map()[%arg10]\n          %3 = affine.apply #map1()[%arg11]\n          air.dma_memcpy_nd (%arg15[%2, %3] [8, 16] [32, 1], %alloc_3[] [] []) : (memref<16x32xf32, 1 : i32>, memref<8x16xf32, 2 : i32>)\n          memref.dealloc %alloc_3 : memref<8x16xf32, 2 : i32>\n        }\n        memref.dealloc %alloc : memref<16x32xf32, 1 : i32>\n        air.dma_memcpy_nd (%arg9[] [] [], %alloc_1[] [] []) : (memref<16x32xf32>, memref<16x32xf32, 1 : i32>)\n        memref.dealloc %alloc_1 : memref<16x32xf32, 1 : i32>\n      }\n    }\n    return\n  }\n}\n"}, {"title": "Transposed mapping", "group": "1. Structured tensor sharding", "note": "The same 2 \u00d7 2 cuts as 2-D block, mapped differently: tensor axis 0 goes over grid axis g1. Piece P(1,0) now lands on PE 1, not PE 2. Cutting and mapping are separate choices.", "shape": [16, 32], "grid": [2, 2], "cuts": [{"axis": 0, "kind": "block", "parts": 2}, {"axis": 1, "kind": "block", "parts": 2}], "map": ["t1", "t0"], "halo": 0, "bytes": 4, "kib": 48, "src": "l2", "mlir": "#map = affine_map<()[s0] -> (s0 * 8)>\n#map1 = affine_map<()[s0] -> (s0 * 16)>\nmodule {\n  func.func @dist_copy(%arg0: memref<16x32xf32>, %arg1: memref<16x32xf32>) {\n    %c1 = arith.constant 1 : index\n    %c1_0 = arith.constant 1 : index\n    air.launch (%arg2, %arg3) in (%arg4=%c1, %arg5=%c1_0) args(%arg6=%arg0, %arg7=%arg1) : memref<16x32xf32>, memref<16x32xf32> {\n      air.segment @dist_copy_seg  args(%arg8=%arg6, %arg9=%arg7) : memref<16x32xf32>, memref<16x32xf32> {\n        %alloc = memref.alloc() : memref<16x32xf32, 1 : i32>\n        %alloc_1 = memref.alloc() : memref<16x32xf32, 1 : i32>\n        air.dma_memcpy_nd (%alloc[] [] [], %arg8[] [] []) : (memref<16x32xf32, 1 : i32>, memref<16x32xf32>)\n        %c2 = arith.constant 2 : index\n        %c2_2 = arith.constant 2 : index\n        air.herd @dist_copy_herd  tile (%arg10, %arg11) in (%arg12=%c2, %arg13=%c2_2) args(%arg14=%alloc, %arg15=%alloc_1) : memref<16x32xf32, 1 : i32>, memref<16x32xf32, 1 : i32> {\n          %alloc_3 = memref.alloc() : memref<8x16xf32, 2 : i32>\n          %0 = affine.apply #map()[%arg11]\n          %1 = affine.apply #map1()[%arg10]\n          air.dma_memcpy_nd (%alloc_3[] [] [], %arg14[%0, %1] [8, 16] [32, 1]) : (memref<8x16xf32, 2 : i32>, memref<16x32xf32, 1 : i32>)\n          %2 = affine.apply #map()[%arg11]\n          %3 = affine.apply #map1()[   if(!halo&&L.spec.imports)L.spec.imports.forEach(([dst,src,n])=>{const a=Math.min(src,dst),b=Math.max(src,dst),k=a+"-"+b;
    pair[k]=pair[k]||{a,b,n:0,dirs:new Set()};pair[k].n+=n;pair[k].dirs.add(src===a?"ab":"ba")});
  const edge=(x,y,dx,dy)=>{const t=Math.min(Math.abs(dx)>1e-9?(bw/2+4)/Math.abs(dx):1e9,Math.abs(dy)>1e-9?(bh/2+4)/Math.abs(dy):1e9);return [x+dx*t,y+dy*t]};
  const arcs=!halo&&!!L.spec.imports&&G.length===1;let arcDepth=0;
  if(arcs)Object.values(pair).forEach(({a,b,n,dirs})=>{const [x1,y1]=pos[a],[x2]=pos[b],yb=y1+bh/2+3,d=14+12*Math.abs(b-a);arcDepth=Math.max(arcDepth,d);
    arrows+=`<path d="M${x1},${yb} Q${(x1+x2)/2},${yb+2*d} ${x2},${yb}" fill="none" stroke="#D95455" stroke-width="${Math.min(3,1+n/12)}" ${dirs.has("ab")?'marker-end="url(#ah)"':""} ${dirs.has("ba")?'marker-start="url(#ah2)"':""}><title>PE ${a} ⇄ PE ${b}: ${n} ghost elements</title></path>`});
  else Object.values(pair).forEach(({a,b,n,dirs})=>{const [x1,y1]=pos[a],[x2,y2]=pos[b],dx=x2-x1,dy=y2-y1;
    const [sx,sy]=edge(x1,y1,dx,dy),[ex,ey]=edge(x2,y2,-dx,-dy),diag=Math.abs(dx)>1&&Math.abs(dy)>1;
    arrows+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#D95455" stroke-width="${diag?1.2:2.2}" ${diag?'stroke-dasharray="4 3"':""} ${dirs.has("ab")?'marker-end="url(#ah)"':""} ${dirs.has("ba")?'marker-start="url(#ah2)"':""}><title>PE ${a} ⇄ PE ${b}: ${n} ${halo?"halo":"ghost"} elements</title></line>`});
  let H=py+gr*(bh+bg)+4+arcDepth, PW=Math.max(X0+tw,X0+330,gc*(bw+bg),TW);   // room for the captions
  // ④ graph view: mesh nodes at their positions, colored by owner; cut edges dashed red
  const gv=L.spec.graph;
  if(gv&&rank===1){const P=gv.pos,mx=Math.max(...P.map(p=>p[0])),my=Math.max(...P.map(p=>p[1])),sp=Math.max(14,Math.min(34,Math.floor((W-20)/(my+1)))),gy=H+46;
    const own=P.map((_,id)=>L.peIx(L.primaryOf(L.partOf([id])))),X=id=>10+P[id][1]*sp,Y=id=>gy+P[id][0]*sp;
    let cutN=0,es="";gv.edges.forEach(([u,v])=>{const cut=own[u]!==own[v];if(cut)cutN++;
      es+=`<line x1="${X(u)}" y1="${Y(u)}" x2="${X(v)}" y2="${Y(v)}" stroke="${cut?"#D95455":"var(--line)"}" stroke-width="${cut?1.6:1.2}" ${cut?'stroke-dasharray="4 3"':""}/>`});
    s+=cap(0,gy-24,"④ Graph")+sub(80,gy-24,`${cutN} cut edges`)+es;
    P.forEach((_,id)=>{s+=`<circle class="el" data-i="${id}" data-o="${own[id]}" cx="${X(id)}" cy="${Y(id)}" r="${Math.max(4,sp*0.28)}" fill="${peColor(L,own[id])}" stroke="var(--bg)" stroke-width="1.2"><title>id ${id} → PE ${own[id]}</title></circle>`});
    H=gy+mx*sp+20;PW=Math.max(PW,20+my*sp)}
  // ④ tree: the tensor, then each level's pieces, then the leaf PEs; hover a leaf to see its elements
  if(T){const leaves=[...new Map(T.leaves.map(l=>[l.path.join(),l])).values()],nl=leaves.length,gy=H+46,cw=Math.min(90,Math.max(44,Math.floor((W-20)/nl))),depth=Math.max(...leaves.map(l=>l.path.length));
    const rowY=d=>gy+d*54,xs={};leaves.forEach((l,i)=>xs[l.path.join()]=10+i*cw+cw/2);
    const xOf=path=>{const ks=leaves.filter(l=>l.path.slice(0,path.length).join()===path.join());return (xs[ks[0].path.join()]+xs[ks[ks.length-1].path.join()])/2};
    const node=(x,y,w,txt,fill,own,title)=>`<g class="${own!==null?"pe":""}" data-o="${own===null?"":own}"><rect x="${x-w/2}" y="${y-11}" width="${w}" height="22" rx="6" fill="${fill}" stroke="var(--line)"/><text x="${x}" y="${y+4}" font-size="10.5" font-weight="600" fill="${own!==null?"#fff":ink}" text-anchor="middle">${txt}</text>${title?`<title>${title}</title>`:""}</g>`;
    s+=cap(0,gy-24,"④ Tree")+sub(60,gy-24,`a PE is a path of ${depth} coordinates`);
    let t="";const rootX=xOf([]);t+=node(rootX,rowY(0),130,`tensor ${L.shape.join(" × ")}`,"var(--bg)",null,"");
    const drawn={},walk=(n,path,off)=>n.pieces.forEach(p=>{const pth=path.concat([p.pe]),y=rowY(pth.length),x=xOf(pth),px=xOf(path),py=rowY(path.length);
      t+=`<line x1="${px}" y1="${py+11}" x2="${x}" y2="${y-11}" stroke="var(--line)"/>`;
      const lo=p.box.lo.map((v,i)=>v+off[i]),hi=p.box.hi.map((v,i)=>v+off[i]);
      if(p.child){t+=node(x,y,Math.max(60,cw*Math.max(1,leaves.filter(l=>l.path.slice(0,pth.length).join()===pth.join()).length)-8),(()=>{const full=`${pname(p.pid)} · ${p.name}`,room=cw*leaves.filter(l=>l.path.slice(0,pth.length).join()===pth.join()).length-8;return full.length*6.2<=room?full:pname(p.pid)})(),"var(--bg)",null,`${p.name}, PE (${p.pe.join(",")}): ${rstr({lo,hi})}`);walk(p.child,pth,lo)}
      else if(!drawn[pth.join()]){drawn[pth.join()]=1;const ix=L.table[T.leaves.findIndex(l=>l.path.join()===pth.join())];t+=node(x,y,cw-6,`PE ${ix}`,peColor(L,ix),ix,`${pth.map(pe=>"("+pe.join(",")+")").join(" → ")}: ${rstr({lo,hi})}`)}});
    walk(T.root,[],L.shape.map(()=>0));s+=t;H=rowY(depth)+24;PW=Math.max(PW,20+nl*cw)}
  const mk=(id,d,rx)=>`<marker id="${id}" viewBox="0 0 10 10" refX="${rx}" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="${d}" fill="${id==="ahm"?"#52657B":"#D95455"}"/></marker>`;
  $("pic").innerHTML=`<div style="overflow-x:auto"><svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${H}" viewBox="0 0 ${PW} ${H}"><defs>${mk("ah","M0,0L10,5L0,10z",8)}${mk("ah2","M10,0L0,5L10,10z",2)}${mk("ahm","M0,0L10,5L0,10z",8)}</defs>${s}${arrows}</svg></div>`;
  L.maxB=maxB;
  const fit=over?`<b style="color:var(--comm)">${over} PE${over>1?"s":""} over budget</b>`:`<b style="color:var(--ok)">fits</b>`;
  const cap_=Object.assign({},L.spec.capacity||{},{L1:budget});
  if(T)$("stat").innerHTML=Object.entries(treeLevels(T.root,bytes,{})).map(([lv,b])=>{const c=cap_[lv];return `${lv}: fullest ${fmtB(b)}`+(c?` of ${fmtB(c)} · `+(b<=c?`<b style="color:var(--ok)">fits</b>`:`<b style="color:var(--comm)">needs a split of ${Math.ceil(b/c)}</b>`):"")}).join(" &nbsp; ");
  else  $("stat").innerHTML=`max ${fmtB(maxB)} / PE of ${fmtB(budget)} · ${fit}`+(pinned?` · vs A (${pinned.name}): ${fmtB(pinned.maxB)} / PE → ${maxB<=pinned.maxB?(pinned.maxB/maxB).toFixed(2)+"× less":(maxB/pinned.maxB).toFixed(2)+"× more"}`:"");
  const svgEl=$("pic").querySelector("svg");
  svgEl.querySelectorAll(".el").forEach(e=>{e.onmouseenter=()=>{hl(+e.dataset.o);$("formula").textContent=formula(L,e.dataset.i.split(",").map(Number))};e.onmouseleave=unhl});
  svgEl.querySelectorAll(".pe").forEach(e=>{e.onmouseenter=()=>hl(+e.dataset.o);e.onmouseleave=unhl});
  function hl(o){svgEl.querySelectorAll(".el,.pe").forEach(e=>e.style.opacity=+e.dataset.o===o?1:.2)}
  function unhl(){svgEl.querySelectorAll(".el,.pe").forEach(e=>e.style.opacity="");$("formula").textContent=hint(L)}
  $("formula").textContent=hint(L);
}

// ---------- UI ----------
function parseList(v){return v.split(/[x×,\s]+/).filter(Boolean).map(Number)}
function syncForm(){
  const box=$("cuts");box.innerHTML="";
  cur.shape.forEach((n,a)=>{const c=cur.cuts.find(c=>c.axis===a),kind=c?c.kind:"whole";
    box.insertAdjacentHTML("beforeend",`<div class="row3"><div><label>Tensor axis ${a} (${n})</label><select data-a="${a}">${["whole","block","uneven"].map(k=>`<option ${k===kind?"selected":""}>${k}</option>`).join("")}</select></div>`+
      `<div><label>pieces</label><input type="number" min="1" data-p="${a}" value="${c?c.parts:1}" ${c?"":"disabled"}></div></div>`+
      (kind==="uneven"?`<div class="row3"><div><label>sizes</label><input class="mono" data-s="${a}" placeholder="e.g. 3, 7" value="${c&&c.sizes?c.sizes.join(", "):""}"></div>`+
        `<div><label>policy</label><select data-pol="${a}" ${c&&c.sizes?"disabled":""}>${["balanced","tail"].map(k=>`<option ${k===(c.policy||"balanced")?"selected":""}>${k}</option>`).join("")}</select></div></div>`:""))});
  box.querySelectorAll("select").forEach(sel=>sel.onchange=()=>{const a=+sel.dataset.a,k=sel.value;cur.cuts=cur.cuts.filter(c=>c.axis!==a);
    if(k!=="whole"){const ncut=cur.cuts.length;cur.cuts.push({axis:a,kind:k,parts:cur.grid[Math.min(ncut,cur.grid.length-1)]||2,policy:"balanced"});cur.cuts.sort((x,y)=>x.axis-y.axis);
      const k2=cur.cuts.findIndex(c=>c.axis===a),g=Math.min(k2,cur.grid.length-1);if(!(cur.map[g]||"").trim())cur.map[g]="t"+k2}
    delete cur.mlir;delete cur.air;delete cur.imports;delete cur.ghosts;syncForm();render()});
  box.querySelectorAll("input[data-p]").forEach(inp=>inp.oninput=()=>{const c=cur.cuts.find(c=>c.axis===+inp.dataset.p);if(c){c.parts=+inp.value;delete c.sizes;
    const si=box.querySelector(`input[data-s="${c.axis}"]`);if(si)si.value="";const ps=box.querySelector(`select[data-pol="${c.axis}"]`);if(ps)ps.disabled=false;delete cur.mlir;delete cur.air;render()}});
  box.querySelectorAll("input[data-s]").forEach(inp=>inp.oninput=()=>{const c=cur.cuts.find(c=>c.axis===+inp.dataset.s);if(!c)return;
    const v=inp.value.split(/[,\s]+/).filter(Boolean).map(Number);const ps=box.querySelector(`select[data-pol="${c.axis}"]`);
    if(v.length){c.sizes=v;c.parts=v.length;const pi=box.querySelector(`input[data-p="${c.axis}"]`);if(pi)pi.value=v.length;if(ps)ps.disabled=true}else{delete c.sizes;if(ps)ps.disabled=false}
    delete cur.mlir;delete cur.air;render()});
  box.querySelectorAll("select[data-pol]").forEach(sel=>sel.onchange=()=>{const c=cur.cuts.find(c=>c.axis===+sel.dataset.pol);if(c){c.policy=sel.value;delete cur.mlir;delete cur.air;render()}});
  const mb=$("maps");mb.innerHTML="";
  if(cur.table){mb.innerHTML=`<label>Owner table: ${cur.table.length} runs</label>`;return}
  cur.grid.forEach((n,g)=>mb.insertAdjacentHTML("beforeend",`<label>Grid axis g${g} (${n} PEs)</label><input class="mono" data-g="${g}" value="${(cur.map[g]||"").replace(/"/g,"&quot;")}" placeholder="replicated">`));
  mb.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{cur.map[+inp.dataset.g]=inp.value;delete cur.mlir;delete cur.air;render()});
  if(cur.library)innerForm();
}
function innerForm(){  // one select per outer piece: which inner layout goes inside it
  const mb=$("maps"),names=Object.keys(cur.library);let L;try{L=build(Object.assign({},cur,{boxes:null,table:null,library:null}))}catch(e){return}
  mb.insertAdjacentHTML("beforeend",`<h3 style="margin-top:14px">Inside each piece</h3>`);
  L.pids.forEach(pid=>{const key=pid.join(","),v=key in cur.inner?cur.inner[key]:(cur.default||"");
    mb.insertAdjacentHTML("beforeend",`<div class="row"><label style="align-self:center">${pname(pid)}</label><select data-pid="${key}">${names.map(n=>`<option value="${n}" ${n===v?"selected":""}>${n}</option>`).join("")}</select></div>`)});
  mb.querySelectorAll("select[data-pid]").forEach(sel=>sel.onchange=()=>{cur.inner[sel.dataset.pid]=sel.value;render()});
}
function load(spec){cur=JSON.parse(JSON.stringify(spec));$("shape").value=cur.shape.join(" × ");$("grid").value=cur.grid.join(" × ");
  $("halo").value=cur.halo||0;$("bytes").value=cur.bytes||4;$("kib").value=cur.kib||48;syncForm();render()}
function render(){
  try{window.__tree=null;let spec=cur;if(cur.library){fillInner(cur);const T=composeTree(cur);window.__tree=T;spec=T.flat}
    const L=build(spec);$("err").textContent="";draw(L);showCode(L);window.__last=L}
  catch(e){$("err").textContent=e.message}}
function showCode(L){
  const t={python:["Python",pyText(L)],attr:["#dist.layout",attrText(L)],air:["air.api",airText(L)],mlir:["MLIR",L.spec.library?airText(L):cur.mlir||"# MLIR is embedded when the page is rendered with MLIR-AIR installed\n# (python3 examples/gallery.py). Editing the layout drops it."]};
  $("tabs").innerHTML=Object.entries(t).map(([k,[n]])=>`<button data-t="${k}" class="${k===tab?"on":""}">${n}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;showCode(L)});$("code").textContent=t[tab][1]}
$("shape").onchange=()=>{cur.shape=parseList($("shape").value);cur.cuts=cur.cuts.filter(c=>c.axis<cur.shape.length).map(c=>{const d=Object.assign({},c);delete d.sizes;return d});delete cur.mlir;delete cur.air;syncForm();render()};
$("grid").onchange=()=>{cur.grid=parseList($("grid").value);cur.map=cur.grid.map((_,g)=>cur.map[g]||"");delete cur.mlir;delete cur.air;syncForm();render()};
["halo","bytes","kib"].forEach(id=>$(id).oninput=()=>{cur[id]=+$(id).value;if(id==="halo"){delete cur.air;delete cur.mlir}render()});
$("pin").onclick=()=>{if(window.__last){pinned={name:`${cur.title||"layout"} on ${cur.grid.join("×")}`,maxB:window.__last.maxB};render()}};
$("svg").onclick=()=>{const s=$("pic").querySelector("svg");if(!s)return;const css=getComputedStyle(document.documentElement);
  const v=(n,d)=>css.getPropertyValue(n).trim()||d;
  const txt=new XMLSerializer().serializeToString(s).replace(/var\(--muted\)/g,v("--muted","#52657B")).replace(/var\(--ink\)/g,v("--ink","#17253C")).replace(/var\(--bg\)/g,v("--bg","#FFFFFF"));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"image/svg+xml"}));a.download=(cur.title||"layout").replace(/\W+/g,"_")+".svg";a.click()};
const P=$("presets"), rowsByGroup={};
PRESETS.forEach((p,i)=>{const g=p.group||"";let row=rowsByGroup[g];
  if(!row){row=rowsByGroup[g]=document.createElement("div");row.className="pgroup";
    if(g){const l=document.createElement("span");l.className="lbl";l.textContent=g;row.appendChild(l)}P.appendChild(row)}
  const b=document.createElement("button");b.textContent=p.title||`Layout ${i+1}`;
  b.onclick=()=>{P.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");load(p)};row.appendChild(b)});
if(PRESETS.length<2)P.style.display="none";
const first=P.querySelector("button");first&&first.classList.add("on");load(PRESETS[0]);
window.addEventListener("resize",()=>render());
window.distlayout={build,composeTree,levels:s=>treeLevels(composeTree(s).root,4,{}),pyText,attrText,airText,plan,parseExpr,strE};
</script></body></html>
