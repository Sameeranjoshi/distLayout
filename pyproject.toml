[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "distlayout"
version = "0.0.1"
description = "Distributed data layouts over existing tensors and buffers, with an MLIR-AIR backend"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["distlayout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
